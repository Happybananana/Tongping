.shelf-book .shelf-cover{min-width:0;min-height:0}

}

.layout{grid-template-columns:230px minmax(0,1fr) 231px;gap:28px;padding:31px 44px 110px;position:relative;z-index:1;align-items:start}

.rail-subtitle{color:#c5bea6;opacity:.85;letter-spacing:.15em;margin:1px 15px 19px;font-size:9px}.rail-nav{gap:5px}.nav-button{color:#c5d2c6;font-size:12px;letter-spacing:.015em;border-radius:10px;padding:14px 14px;transition:background .25s,transform .25s,color .25s}.nav-button:hover{background:#ffffff16;color:white;transform:translateX(3px)}.nav-button.active{background:linear-gradient(90deg,#e9e4d5 0%,#f5f1e8 100%);color:#214638;border-color:#f2ecd8;box-shadow:0 5px 12px #0b281d22}.nav-button .nav-icon{width:21px}.nav-active-dot{background:#b89457}.add-main{background:linear-gradient(120deg,#bb9761,#d2b17a);border-color:#d8b983;color:#213e32;box-shadow:0 6px 17px #041f172e;font-size:12px;margin:24px 0 17px;padding:13px 9px}.add-main:hover{background:#e2c58e;transform:translateY(-3px)}
.rail-foot{border:1px solid #ffffff23;background:#ffffff0b;border-radius:14px;box-shadow:none;color:#e2e9d9;padding:15px}.rail-foot strong{font-size:12px;color:#f5f2e8}.rail-foot small,.rail-foot .private-hint{color:#b0c2b4}.rail-foot .private-hint{border-top:1px solid #ffffff18}.circle-avatar-stack span{border:2px solid #26483d}
.content{position:relative;min-width:0}.intro{padding:7px 3px 0;margin-bottom:24px;align-items:flex-end}.eyebrow{font-size:10px;color:#8e8466;letter-spacing:.19em;font-weight:800}.headline{font-family:var(--serif);font-weight:600;letter-spacing:-.065em;font-size:clamp(30px,3.25vw,46px);line-height:1.22;color:#20392e}.subhead{color:#859086;font-size:12px;letter-spacing:.015em}.section-title{font:600 22px/1.35 var(--serif);letter-spacing:-.04em;color:#243e32}.section-sub{color:#989c8f;font-size:11px}

/* Hall hero: lit arch, bronze books and luminous tracking. No external assets. */
.gallery-hero{background:radial-gradient(ellipse at 90% 12%,#6b887050 0,transparent 37%),radial-gradient(ellipse at 15% 108%,#416e5361 0,transparent 46%),linear-gradient(128deg,#203e32 0%,#17392e 48%,#23483a 100%);height:385px;min-height:385px;border:1px solid #2a5542;border-radius:19px;padding:31px 36px;display:flex;overflow:hidden;position:relative;isolation:isolate;box-shadow:0 24px 54px #173b2b1f;margin-bottom:16px}

.gallery-hero .hero-content{margin-top:31px;max-width:66%;z-index:4}.hero-kicker{font:750 9px sans-serif;letter-spacing:.19em;color:#d3c49c}.kicker-line{display:inline-block;vertical-align:middle;margin:0 10px;width:24px;height:1px;background:#b5aa7c}.gallery-hero h1{font:500 clamp(32px,3.2vw,48px)/1.39 var(--serif);letter-spacing:-.072em;color:#faf5e8;margin:19px 0 12px;text-wrap:balance}.gallery-hero h1 em{font-style:normal;color:#e1bd85;white-space:nowrap}.gallery-hero p{font-size:11px;color:#c3d5c6;letter-spacing:.035em;line-height:2;margin:0 0 19px}.hero-actions{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.hero-button{background:#eeddbb;border-color:#eeddbb;color:#294639;box-shadow:0 10px 24px #081d183c;font-size:11px;padding:8px 7px 8px 16px;letter-spacing:.03em;transition:transform .25s,box-shadow .25s}.hero-button:hover{transform:translateY(-4px);box-shadow:0 15px 28px #081d1859}.hero-button span{background:#234738;color:#fcf2df}.hero-text-button{display:inline-flex;gap:7px;align-items:center;background:none;color:#e4d4b2;border:0;font-size:10px;border-bottom:1px solid #ddc89977;padding:8px 0;transition:gap .25s}.hero-text-button:hover{gap:13px}.hero-index{position:absolute;bottom:34px;right:34px;color:#e1cba0a6;font-size:9px;letter-spacing:.14em;font-weight:800;z-index:4}
.gallery-scene{position:absolute;z-index:2;right:0;bottom:3px;width:46%;height:345px;perspective:950px;transform-style:preserve-3d;pointer-events:none}

.scene-book{position:absolute;bottom:60px;display:flex;flex-direction:column;padding:20px 18px;justify-content:space-between;border-radius:4px 13px 13px 4px;transform-style:preserve-3d;box-shadow:10px 15px 25px #061a155c, inset -9px 0 18px #170e0e17, inset 2px 0 3px #fff6d763;backface-visibility:hidden}

.page-controls button,.remote-page-controls button{border:2px solid #232127;background:#fff9e9;color:#232127;padding:10px 12px;min-height:39px;cursor:pointer;font-weight:900;box-shadow:2px 2px 0 #222125}
.page-controls button:hover:not(:disabled),.remote-page-controls button:hover:not(:disabled){background:#f8e348;transform:translateY(-2px)}
.page-controls button:disabled,.remote-page-controls button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.page-controls .pager-number-group{display:flex;gap:5px}
.page-controls .pager-page{min-width:40px}
.page-controls .pager-page.active{background:#1c1b21;color:#f8e84a}
.page-controls .pager-page-label{font:900 10px ui-monospace,monospace;color:#a94e42;margin-left:6px}
.remote-page-controls{width:100%;grid-column:1/-1;padding:18px 6px;border-top:2px dashed #21212655;margin-top:7px}
.remote-page-controls span{padding:0 10px}

.railway-hero:before{content:"";pointer-events:none;position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,42,35,.94) 0%,rgba(12,42,35,.86) 40%,rgba(12,42,35,.14) 100%);z-index:-1}
.railway-hero:after{content:"01 — 终点未定";position:absolute;right:15px;bottom:16px;writing-mode:vertical-rl;font:800 10px/1 ui-monospace,monospace;letter-spacing:.25em;color:#f7e9c9a6;pointer-events:none}
.railway-route-top{display:flex;justify-content:space-between;gap:15px;padding-bottom:17px;border-bottom:1px solid #fff4cf7a;font:850 10px ui-monospace,monospace;letter-spacing:.18em}
.railway-route-top span:last-child{color:#f6db91}
.railway-headline{max-width:680px;position:relative;margin-top:100px}
.railway-headline p{font:850 11px ui-monospace,monospace;color:#f1d897;letter-spacing:.17em}
.railway-headline h1{font:900 clamp(45px,6.2vw,86px)/1.08 "Noto Serif SC","Songti SC",serif;letter-spacing:-.065em;margin:17px 0 24px;color:#fff9eb;text-shadow:0 7px 15px #071d18b5}
.railway-headline h1 em{font-style:normal;color:#f4dc91;white-space:normal}
.railway-headline>span{display:block;font-size:13px;line-height:2;color:#ecf0dc}
.railway-departure{position:absolute;right:clamp(17px,4vw,50px);top:85px;width:205px;display:flex;flex-direction:column;gap:9px;align-items:flex-start;padding:19px;border:1px solid #e4d5aa98;border-radius:2px;background:#193e34d6;backdrop-filter:blur(6px);box-shadow:6px 7px 0 #0c2923aa;transform:rotate(3deg)}
.railway-departure b{color:#f4d991;font:900 9px ui-monospace,monospace;letter-spacing:.16em}.railway-departure strong{font:900 26px ui-monospace,monospace;line-height:1.1}.railway-departure small{font-size:10px;line-height:1.6;color:#d9e9d5}
.railway-tracks{position:absolute;bottom:0;left:0;width:100%;height:6px;background:repeating-linear-gradient(90deg,#f3db96 0 4px,transparent 4px 20px)}
.station-panel{background:var(--rail-paper);border:1px solid #a7b19c;box-shadow:6px 8px 0 #1c43352b;padding:clamp(17px,4vw,38px);margin:35px 0 44px;position:relative}
.station-panel:before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:repeating-linear-gradient(90deg,#143f34 0 34px,#ead592 34px 39px)}
.station-section-heading>span,.station-scoreboard>div:first-child>span{font:850 11px ui-monospace,monospace;letter-spacing:.14em;color:#617969}
.station-section-heading h2,.station-scoreboard h2{font:850 clamp(30px,4.2vw,54px)/1.17 "Noto Serif SC","Songti SC",serif;color:var(--rail-deep);letter-spacing:-.05em;margin:12px 0 9px}
.station-section-heading p{font-size:12px;color:#688076;line-height:1.8;margin:0 0 22px}
.station-searchbar{display:flex;align-items:center;gap:12px;border-bottom:3px solid #153e33;background:#f0ecd9;padding:10px 14px;max-width:100%;margin:10px 0}
.station-searchbar span{font-size:30px;color:#123c33}
.station-searchbar input{min-width:0;flex:1;outline:0;border:0;background:transparent;padding:9px 4px;color:#173e33;font-weight:750;font-size:clamp(14px,1.7vw,18px)}
.station-searchbar:focus-within{background:#f8eabb}
.station-shortcuts{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin:18px 0 35px}
.station-shortcuts button{background:#dae6d6;border:1px solid #98a898;color:#1c493a;font-size:11px;font-weight:800;padding:9px 12px;cursor:pointer}
.station-shortcuts button:hover{background:#eade9a}
.travel-columns{display:grid;grid-template-columns:1fr 1fr;gap:27px}
.travel-columns h3{font:900 10px ui-monospace,monospace;letter-spacing:.075em;padding-bottom:11px;border-bottom:1px solid #a6b4a1;color:#415e4d;margin:0 0 13px}
.travel-grid,.travel-remote{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;align-content:start}
.rail-destination{display:flex;flex-direction:column;gap:7px;align-items:start;text-align:left;min-height:162px;border:1px solid #92a897;background:linear-gradient(137deg,#fffef3,#e7eee2);color:var(--rail-ink);padding:15px;position:relative;cursor:pointer;transition:transform .2s,box-shadow .2s}
.rail-destination:nth-child(4n+2){background:#e6ead3}.rail-destination:hover{transform:translateY(-4px);box-shadow:4px 5px 0 #184c3945}
.dest-counter{font:850 9px ui-monospace,monospace;letter-spacing:.1em;color:#788b77}.rail-destination strong{font:900 clamp(17px,2vw,25px) "Noto Serif SC","Songti SC",serif;line-height:1.25;overflow-wrap:anywhere}.rail-destination>span:nth-of-type(2){font-size:10px;color:#738579;line-height:1.4}
.destination-foot{margin-top:auto;width:100%;display:flex;align-items:baseline;justify-content:space-between;gap:4px;padding-top:8px;border-top:1px dashed #8ba18e;font:800 10px ui-monospace,monospace}.destination-foot b{font-size:17px;color:#315a44}
.travel-grid>.page-controls{grid-column:1/-1;justify-content:start;margin:5px 0 16px}
.station-empty,.travel-remote>.search-prompt,.travel-remote>.empty-state{grid-column:1/-1;padding:22px;background:#e7eee1;color:#38604f;font-size:12px;line-height:1.7}
.travel-remote .remote-card{border:1px solid #a0b5a6;background:#f2f2e5!important;padding:11px!important;box-shadow:none!important;display:flex;align-items:center;flex-wrap:wrap}
.travel-remote .remote-card .small-btn{border:0;background:#214e40;color:#f9f1db;max-width:none;margin:0}
.travel-remote .remote-cover{width:45px;min-width:45px}
.travel-remote .remote-page-controls{grid-column:1/-1}
.station-scoreboard{background:var(--rail-deep);color:#fff8d9;display:grid;grid-template-columns:minmax(180px,.8fr) 1.3fr;gap:30px;padding:clamp(20px,4vw,40px);margin:53px 0;border-top:7px solid #edd791;position:relative;box-shadow:7px 8px 0 #153d344d}
.station-scoreboard:after{content:"◇";position:absolute;left:12px;bottom:4px;font-size:70px;opacity:.08;pointer-events:none}
.station-scoreboard>div:first-child>span{color:#c5d5c3}.station-scoreboard h2{color:#f1d996;margin:12px 0 22px}
.station-toggle{display:flex;align-items:center;gap:8px;line-height:1.4;font-size:12px;color:#d7e5d2;cursor:pointer}.station-toggle input{accent-color:#efd891}
.station-score-list{display:grid;gap:4px;align-content:start}
.station-score{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) 70px 65px;align-items:center;gap:10px;background:#f8f1d9;border:0;border-bottom:1px dashed #60776a;color:#194134;text-align:left;padding:12px;min-height:65px;cursor:pointer}
.station-score:nth-child(even){background:#e3e8d5}
.station-score>span{font:900 22px ui-monospace,monospace;color:#6f8975}
.station-score strong{font:900 clamp(14px,1.7vw,19px) "Noto Serif SC","Songti SC",serif;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.station-score small{font-size:10px;color:#648071}.station-score b{font:900 25px ui-monospace,monospace;color:#163f32;text-align:right}
.station-score:hover{background:#f6db93}
.boarding-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:19px}
.boarding-pass{position:relative;display:flex;flex-direction:column;align-items:stretch;min-height:186px;text-align:left;border:0;background:#ece2bc;color:#183b31;padding:17px 20px;cursor:pointer;box-shadow:5px 6px 0 #1c4a3a32;clip-path:polygon(0 0,100% 0,100% 44%,97% 50%,100% 56%,100% 100%,0 100%,0 56%,3% 50%,0 44%);transition:transform .2s}
.boarding-pass:nth-child(even){background:#dde6d4}
.boarding-pass:hover{transform:translateY(-5px) rotate(-.6deg)}
.pass-route{display:flex;justify-content:space-between;gap:8px;align-items:center;padding-bottom:13px;border-bottom:1px dashed #779180;font:900 10px ui-monospace,monospace;letter-spacing:.03em}
.pass-route small{font-size:9px;color:#758b77}
.boarding-pass>strong{font:850 clamp(20px,2.7vw,33px) "Noto Serif SC","Songti SC",serif;margin:19px 15px 12px 0;letter-spacing:-.03em}
.pass-details{font-size:12px;display:flex;justify-content:space-between;margin-top:auto;border-top:1px dashed #7d967a;padding-top:10px}.pass-details b{font:900 15px ui-monospace,monospace}
.boarding-pass>i{font-size:25px;font-style:normal;position:absolute;right:13px;bottom:10px;color:#738b77}
.stat-travel-gate{cursor:pointer;color:inherit;display:flex;flex-direction:column;align-items:start;text-align:left}
.stat-travel-gate:hover{background:#deead9!important}
/* Mobile adaptations */
@media(max-width:1000px){.travel-columns{grid-template-columns:1fr}.railway-departure{width:165px}.railway-headline{margin-top:155px}.station-scoreboard{gap:17px}}
@media(max-width:760px){
 .bottom-nav button{font-size:9px!important;gap:2px!important;min-width:0!important;flex:1}
 .bottom-nav button .bottom-icon svg{width:19px;height:19px}
 .page-controls{width:100%;gap:5px}.page-controls button{padding:8px;font-size:10px;min-height:35px}.page-controls .pager-page{min-width:31px}.page-controls .pager-page-label{display:none}
 .railway-hero{min-height:510px;margin:2px 0 28px;padding:17px 18px;background-position:56% bottom}.railway-hero:before{background:linear-gradient(180deg,#0b2a25ed 0%,#123d33ba 56%,#0e3024b5 100%)}
 .railway-route-top{font-size:8px;letter-spacing:.05em}.railway-headline{margin-top:180px}.railway-headline h1{font-size:clamp(42px,9vw,65px);line-height:1.15;margin:13px 0 17px}.railway-headline>span{font-size:11px}.railway-departure{top:66px;right:17px;width:155px;padding:12px;transform:rotate(4deg)}.railway-departure strong{font-size:20px}.railway-departure small{font-size:9px}
 .station-panel{padding:24px 14px;margin:20px 0 30px}.station-section-heading h2,.station-scoreboard h2{font-size:32px}.travel-columns{gap:20px}.travel-grid,.travel-remote{grid-template-columns:1fr 1fr;gap:8px}.rail-destination{min-height:142px;padding:12px}.rail-destination strong{font-size:18px}.station-searchbar input{font-size:13px}.travel-remote .remote-card{grid-column:1/-1}.station-scoreboard{grid-template-columns:1fr;padding:18px 13px;margin:30px 0}.station-score{grid-template-columns:27px minmax(0,1fr) 52px 40px;gap:4px;padding:10px 6px}.station-score>span{font-size:18px}.station-score strong{font-size:13px}.station-score small{font-size:8px}.station-score b{font-size:20px}.boarding-grid{grid-template-columns:1fr;gap:13px}.boarding-pass{min-height:165px}
}
@media(max-width:390px){.bottom-nav button{font-size:8px!important}.bottom-nav button .bottom-icon svg{width:18px;height:18px}.travel-grid{grid-template-columns:1fr}.railway-hero{min-height:525px}.railway-headline{margin-top:170px}}
@media(prefers-reduced-motion:reduce){.rail-destination,.boarding-pass,.page-controls button{transition:none!important}.rail-destination:hover,.boarding-pass:hover{transform:none!important}}

/* V0.5.3-r1 · podium champion-only visual fix.
   Use a deliberate poster + editorial copy + score composition. Other podium
   cards, ranking filters and pagination remain unchanged. */
.rank-broadcast .broadcast-no-1 {
  display: grid;
  grid-template-columns: minmax(0, .91fr) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) auto;

function parseCsv(text){
  const rows=[];let row=[],cell='',quoted=false;
  const str=String(text||'').replace(/^\uFEFF/,'');
  for(let i=0;i<str.length;i++){
    const c=str[i];
    if(quoted){if(c==='"'&&str[i+1]==='"'){cell+='"';i++;}else if(c==='"'){quoted=false;}else cell+=c;}
    else if(c==='"'&&cell===''){quoted=true;}
    else if(c===','){row.push(cell);cell='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&str[i+1]==='\n')i++;row.push(cell);if(row.some(x=>String(x).trim()))rows.push(row);row=[];cell='';}
    else cell+=c;
  }
  if(quoted)throw Error('CSV 引号未闭合');
  row.push(cell);if(row.some(x=>String(x).trim()))rows.push(row);
  return rows;
}
const HEADER_ALIASES={
 title:['作品名','名称','番剧名','游戏名','标题','title','name','番剧','作品','游戏'],
 category:['类别','类型','分类','媒介','kind','category','type'],

 status:['状态','进度状态','收藏状态','status','观看状态','游戏状态'],
 note:['短评','评价','评论','备注','笔记','感想','comment','note','review'],

const normalizeHeader=x=>String(x??'').replace(/\s|[\-_.:：/()（）]/g,'').toLowerCase();
function guessMapping(headers){
  const norm=headers.map(normalizeHeader), mapping={};
  for(const [key,values] of Object.entries(HEADER_ALIASES)){
    const candidates=values.map(normalizeHeader);
    const index=norm.findIndex(h=>candidates.includes(h));
    mapping[key]=index;
  }
  return mapping;
}
function normalizeCategory(raw,fallback='anime'){
  const s=String(raw??'').trim().toLowerCase();
  if(/game|游戏|电玩|pc|主机|steam|ps5|switch/.test(s))return 'game';
  if(/anime|动画|番剧|动漫|番组|animation/.test(s))return 'anime';
  return fallback==='game'?'game':'anime';
}
function normalizeStatus(raw,category='anime'){
  const s=String(raw??'').trim().toLowerCase();
  if(/想|计划|未开始|待看|未玩|wish|want|plan/.test(s))return 'want';
  if(/正在|进行|追番|在看|在玩|游玩中|观看中|playing|watching|doing|progress/.test(s))return 'doing';
  if(/弃|搁置|暂停|放弃|paused|drop|hold/.test(s))return 'paused';
  if(/完|通关|看过|玩过|已看|已玩|完成|done|complete|finish/.test(s))return 'done';
  return 'want'; // 缺省状态不应被误判为已经看完/通关
}
function validateScore(raw){
  if(raw==null||String(raw).trim()==='')return null;
  const n=Number(String(raw).trim());
  if(!Number.isFinite(n)||n<0.5||n>10||Math.abs(n*2-Math.round(n*2))>.00001)throw Error('评分须为 0.5～10，步长 0.5');
  return n;
}
function parseImportRows(grid,{fallbackCategory='anime',maxRows=MAX_IMPORT_ROWS}={}){
  if(!Array.isArray(grid)||grid.length<2)throw Error('至少需要标题行和一行作品数据');
  const headerRow=Math.max(0,grid.slice(0,Math.min(10,grid.length)).findIndex(line=>guessMapping((line||[]).map(x=>String(x??'').trim())).title>=0));
  const headers=(grid[headerRow]||[]).map(x=>String(x??'').trim());

  if(grid.length-headerRow-1>maxRows)throw Error(`一次最多导入 ${maxRows} 行，请分批处理`);

  if(!file||file.size>MAX_SHEET_BYTES)throw Error('文件不能超过 2MB');

function scoreImportCandidate(row,candidate){

  async function fetchBangumiDetail(item){
    if(item.provider!=='bangumi' || !['anime','game'].includes(item.category) || !/^\d+$/.test(String(item.providerId||'')))return null;
    const {data:sessionData,error} = await db.auth.getSession();
    if(error || !sessionData.session?.access_token)return null;
    const base=(({}).VITE_SEARCH_API_BASE||'').trim().replace(/\/$/,'');
    const url=`${base}/api/subject?category=${encodeURIComponent(item.category)}&id=${encodeURIComponent(item.providerId)}`;
    const resp=await fetch(url,{headers:{Authorization:`Bearer ${sessionData.session.access_token}`},signal:AbortSignal.timeout(7000)});
    if(!resp.ok)throw new Error(`Bangumi 详情 HTTP ${resp.status}`);
    const result=await resp.json();
    return result.item?.providerId===String(item.providerId)?result.item:null;
  }
  async function hydrateBangumiDetail(id){
    const item=itemById(id);
    if(!item||item.provider!=='bangumi'||!item.providerItemId||detailLookups.has(id))return;
    detailLookups.add(id);
    // Existing catalog entries created in previous versions may lack metadata.
    // Query once on opening detail, displaying the fresh value without granting
    // browser clients arbitrary UPDATE rights over shared official scores.
    try{
      const found=await fetchBangumiDetail({...item,providerId:item.providerItemId});
      if(!found)return;
      const updates={bangumiScore:found.bangumiScore,bangumiRatingTotal:found.bangumiRatingTotal,
        bangumiRank:found.bangumiRank,platform:found.platform||item.platform,
        tags:found.tags?.length?found.tags:item.tags,
        description:item.description||found.description};
      Object.assign(item,updates);detailMetadata.set(id,updates);
      if(view.page==='detail'&&view.detailId===id)$('page').innerHTML=detailPage();
    }catch(e){console.info('[同频] Bangumi 资料暂时不可用',e.message)}
  }

  function displayError(error){
    const raw=String(error?.message||error||'未知错误');
    if(/Failed to fetch|NetworkError|fetch failed/i.test(raw))return '网络连接失败，请检查大陆网络到 Supabase Auth 的连通性';
    if(/Invalid login credentials/i.test(raw))return '邮箱或密码不正确（仅用旧 Magic Link 登录的账号可能尚未设置密码）';
    if(/User already registered/i.test(raw))return '这个邮箱已注册，请返回登录；如果还没设过密码，请使用原登录会话设置密码';
    if(/relation .* does not exist|schema cache|Could not find the function|PGRST202|PGRST205/i.test(raw))return '数据库还未正确初始化，请先运行 supabase/schema.sql';
    return raw.slice(0,170);
  }

  // Private-circle discussion: fetched on demand so initial startup remains responsive.
  function postCards(list){
    if(threadData.loading&&!threadData.posts.length)return '<div class="discussion-empty">正在读取圈内帖子…</div>';
    if(threadData.error)return `<div class="discussion-empty">${esc(threadData.error)}<p>请先执行 supabase/migration_v057.sql。</p></div>`;
    if(!list.length)return '<div class="discussion-empty">这里还没有帖子。分享你的第一份通关感想或追番心得吧。</div>';
    return `<div class="post-grid">${list.map(p=>{const item=itemById(p.itemId);if(!item)return '';const comments=threadData.comments.filter(c=>c.postId===p.id).length;
      return `<button class="post-tile" type="button" data-action="open-post" data-id="${esc(p.id)}"><span class="post-tile-cover">${cover(item,'post-cover')}</span><span class="post-tile-copy"><span class="post-kicker">${esc(CAT_NAME[item.category])} · ${esc(item.name)}</span><strong>${esc(p.title)}</strong><small>${esc(userById(p.userId).name)} · ${notifyAge(p.createdAt)} · ${comments} 条回复</small><span class="post-teaser">${p.spoiler?'◈ 含剧透内容，点击后查看':esc(p.body.slice(0,88))}</span></span><span class="post-arrow">↗</span></button>`}).join('')}</div>`;
  }
  function posts(){

      ${postCards(pg.items)}${renderPager('posts',pg.page,pg.totalPages)}`;

  function postPage(){
    const p=threadData.posts.find(x=>x.id===view.postId);if(!p)return `<div class="panel discussion-empty">${threadData.loading?'正在载入帖子…':threadData.error?esc(threadData.error):'未找到帖子或你没有权限查看。'}<p><button class="btn-ghost" data-action="navigate" data-page="posts">返回讨论区</button></p></div>`;

  }
  async function loadPosts(force=false){
    if(!activeCircle||!db||threadData.loading)return;
    if(!force&&threadData.circleId===activeCircle.id&&Date.now()-threadData.loadedAt<25000)return;
    const serial=++threadSerial,cid=activeCircle.id;
    threadData.loading=true;threadData.error='';
    const [postsResult,commentsResult]=await Promise.all([
      db.from('circle_posts').select('id,user_id,item_id,circle_id,title,body,spoiler,created_at').eq('circle_id',cid).order('created_at',{ascending:false}).limit(200),
      db.from('post_comments').select('id,post_id,user_id,circle_id,body,created_at').eq('circle_id',cid).order('created_at',{ascending:true}).limit(600)
    ]);
    if(serial!==threadSerial||activeCircle?.id!==cid)return;
    if(postsResult.error||commentsResult.error){threadData.error='帖子暂不可用：'+displayError(postsResult.error||commentsResult.error);threadData.posts=[];threadData.comments=[];}
    else{threadData.posts=postsResult.data.map(p=>({id:p.id,userId:p.user_id,itemId:p.item_id,title:p.title,body:p.body,spoiler:p.spoiler,createdAt:p.created_at}));threadData.comments=commentsResult.data.map(c=>({id:c.id,postId:c.post_id,userId:c.user_id,body:c.body,createdAt:c.created_at}));threadData.loadedAt=Date.now();}
    threadData.circleId=cid;threadData.loading=false;
    if(['feed','posts','post','detail'].includes(view.page))render();
  }
  function renderPostChoices(term=''){

  }

    preview.hidden=false;results.hidden=true;
    const search=$('post-item-search');if(search)search.value=item.name;
  }

  }

  function matchedImportItem(row){return data.items.find(x=>x.category===row.category&&((row.providerId&&x.provider==='bangumi'&&String(x.providerItemId)===String(row.providerId))||normalizedName(x.name)===normalizedName(row.name)||normalizedName(x.subtitle)===normalizedName(row.name)))||null;}
  function sheetMatchDescription(row,i){
    if(row.match)return '<span class="sheet-match">已匹配圈内共享库</span>';
    if(row.error)return `<small class="sheet-error">${esc(row.error)}</small>`;
    const candidates=row.suggestions||[];
    const status=row.lookupState==='loading'?'正在在线搜索…':row.lookupState==='error'?'网络未连通':row.lookupState==='done'&&!candidates.length?'在线无可靠候选':row.lookupState==='queued'?'等待联网搜索':'尚未联网匹配';
    return `<div class="sheet-candidate-box" id="sheet-candidates-${i}"><span class="sheet-lookup-state">${row.remoteChoice?'已确认网络作品 · '+esc(row.remoteChoice.provider):status}</span>${candidates.length?`<div class="sheet-candidate-list">${candidates.map((c,j)=>`<button type="button" class="sheet-candidate ${row.remoteChoice===c?'is-picked':''}" data-action="sheet-select-candidate" data-row="${i}" data-candidate="${j}" aria-pressed="${row.remoteChoice===c}">${coverImageUrl(c.coverUrl)?`<img class="sheet-candidate-cover" src="${esc(coverImageUrl(c.coverUrl))}" alt="" loading="lazy" onerror="this.remove()"/>`:''}<b>${row.remoteChoice===c?'✓ ':'○ '}${esc(c.name)}</b><small>${esc(c.provider==='bangumi'?'Bangumi':c.provider==='jikan'?'MAL / Jikan':c.provider==='igdb'?'IGDB':c.provider==='rawg'?'RAWG':c.provider||'在线资料')} · ${esc(c.year||'年份未知')} ${c.platform?`· ${esc(c.platform)}`:''}</small></button>`).join('')}</div>`:''}${row.remoteChoice?`<button type="button" class="sheet-unpick" data-action="sheet-clear-candidate" data-row="${i}">取消该匹配</button>`:''}${row.lookupState==='error'?`<button type="button" class="sheet-unpick" data-action="sheet-retry" data-row="${i}">↻ 重新搜索该条</button>`:''}</div>`;
  }
  function updateSheetRow(i){const row=bulkDraft?.rows?.[i],holder=$(`sheet-match-${i}`);if(row&&holder)holder.innerHTML=sheetMatchDescription(row,i);updateSheetSummary();}
  async function previewSheetFile(input){const file=input.files?.[0];if(!file)return;const serial=++sheetLookupSerial;try{
    $('sheet-preview').textContent='正在解析表格与匹配共享作品…';const grid=await readSheetFile(file);
    if(serial!==sheetLookupSerial||!$('sheet-preview'))return;
    bulkDraft=parseImportRows(grid,{fallbackCategory:$('sheet-category')?.value||'anime'});
    const seen=new Set();for(const row of bulkDraft.rows){const key=row.category+':'+normalizedName(row.name);row.match=matchedImportItem(row);row.suggestions=[];row.remoteChoice=null;row.lookupState=row.match?'matched':'queued';if(seen.has(key)){row.error='表格内重复作品';row.selected=false;}seen.add(key);if(row.match&&own(row.match.id)){row.error='已有个人记录，不会覆盖';row.selected=false;}}
    const rows=bulkDraft.rows.map((r,i)=>`<tr><td><input type="checkbox" data-action="bulk-row-toggle" data-row="${i}" ${r.selected?'checked':''} ${r.error?'disabled':''} aria-label="选择第${r.line}行"/></td><td>${r.line}</td><td><strong>${esc(r.name)}</strong><small>${esc(CAT_NAME[r.category])}${r.year?' · '+esc(r.year):''}</small></td><td>${r.rating==null?'—':r.rating.toFixed(1)}</td><td id="sheet-match-${i}">${sheetMatchDescription(r,i)}</td></tr>`).join('');
    $('sheet-preview').innerHTML=`<div class="sheet-summary" id="sheet-summary" role="status"></div><div class="sheet-online-bar"><div><strong>联网自动找片</strong><span>每轮查询最多 8 部未匹配作品，控制请求频率。点击候选才会使用它的封面与来源信息。</span></div><button type="button" class="btn-ghost" data-action="sheet-lookup-more" id="sheet-lookup-more">继续匹配剩余作品</button></div><div class="sheet-table-scroll"><table><thead><tr><th>选</th><th>行</th><th>作品</th><th>我的评分</th><th>匹配情况 / 候选选择</th></tr></thead><tbody>${rows}</tbody></table></div><label class="sheet-opt"><input id="sheet-create-missing" type="checkbox"/> 对仍找不到、或未确认在线候选的作品，允许按原表格名称手动建档</label><label class="sheet-opt"><input id="sheet-share" type="checkbox"/> 将导入记录公开给圈内伙伴（默认仅自己可见）</label><div class="modal-actions"><button class="btn-ghost" data-action="close">取消</button><button class="primary-btn" data-action="confirm-sheet" id="sheet-confirm">确认导入已选条目</button></div>`;
    updateSheetSummary();void autoFindSheetMatches(serial);
  }catch(e){if(serial!==sheetLookupSerial)return;bulkDraft=null;if($('sheet-preview'))$('sheet-preview').textContent='解析失败：'+String(e.message||e)}}
  function updateSheetSummary(){const el=$('sheet-summary');if(!el||!bulkDraft)return;const selected=bulkDraft.rows.filter(r=>r.selected&&!r.error),missing=bulkDraft.rows.filter(r=>!r.match&&!r.error),pending=missing.filter(r=>r.lookupState==='queued');
    el.textContent=`识别 ${bulkDraft.rows.length} 条 · 已选 ${selected.length} 条 · 共享库 ${selected.filter(r=>r.match).length} 条 · 已确认网络候选 ${selected.filter(r=>r.remoteChoice).length} 条 · 等待联网 ${pending.length} 条`;
    const button=$('sheet-lookup-more');if(button){button.disabled=!pending.length||bulkDraft.lookingUp;button.textContent=bulkDraft.lookingUp?'搜索中…':pending.length?`继续匹配剩余 ${pending.length} 条`:'网络匹配已完成';}const confirm=$('sheet-confirm');if(confirm){confirm.disabled=!!bulkDraft.lookingUp;confirm.title=bulkDraft.lookingUp?'联网搜索正在进行，请稍后确认':''}}
  async function autoFindSheetMatches(serial=sheetLookupSerial){const draft=bulkDraft;if(!draft||draft.lookingUp)return;const indices=draft.rows.map((r,i)=>(r.selected&&!r.error&&!r.match&&r.lookupState==='queued')?i:-1).filter(i=>i>=0).slice(0,8);
    if(!indices.length){updateSheetSummary();return;}
    draft.lookingUp=true;updateSheetSummary();
    try{
      const {data:sessionData,error}=await db.auth.getSession();if(error||!sessionData.session?.access_token)throw Error('登录状态失效，请重新登录');
      const token=sessionData.session.access_token,base=(({}).VITE_SEARCH_API_BASE||'').trim().replace(/\/$/,'');
      for(const i of indices){if(serial!==sheetLookupSerial||bulkDraft!==draft||!$('sheet-preview'))break;
        const row=draft.rows[i];row.lookupState='loading';updateSheetRow(i);
        try{
          const url=`${base}/api/search?category=${encodeURIComponent(row.category)}&q=${encodeURIComponent(row.name)}&page=1`;
          const response=await fetch(url,{headers:{Authorization:`Bearer ${token}`},signal:AbortSignal.timeout(14000)});
          const payload=await response.json().catch(()=>({}));if(!response.ok)throw Error(payload.error||`HTTP ${response.status}`);
          if(serial!==sheetLookupSerial||bulkDraft!==draft)break;
          row.suggestions=rankImportCandidates(row,payload.items,3);row.lookupState='done';
        }catch(e){if(serial!==sheetLookupSerial||bulkDraft!==draft)break;row.lookupState='error';row.lookupError=String(e.message||e).slice(0,75);}
        updateSheetRow(i);
        // Rate-limited query cadence: avoids bursts when fallback providers are active.
        await new Promise(resolve=>setTimeout(resolve,450));
      }
    }catch(e){if(serial===sheetLookupSerial&&bulkDraft===draft){for(const i of indices){const row=draft.rows[i];if(row.lookupState==='queued')row.lookupState='error';updateSheetRow(i)}toast('联网找片失败：'+displayError(e));}}
    finally{if(bulkDraft===draft){draft.lookingUp=false;updateSheetSummary()}}
  }
  async function confirmSheetImport(){if(isBusy||!bulkDraft||bulkDraft.lookingUp)return;const selected=bulkDraft.rows.filter(r=>r.selected&&!r.error);if(!selected.length){toast('请选择可导入的作品');return}
    const createMissing=!!$('sheet-create-missing')?.checked,share=!!$('sheet-share')?.checked;
    if(selected.some(r=>!r.match&&!r.remoteChoice)&&!createMissing){toast('存在未确认候选的作品。请逐项选择，或允许手动建档');return}
    const countNetwork=selected.filter(r=>r.remoteChoice).length,countManual=selected.filter(r=>!r.match&&!r.remoteChoice).length;
    if(!confirm(`确认导入 ${selected.length} 条记录？联网资料 ${countNetwork} 条，手动建档 ${countManual} 条。${share?'这些记录将对圈内公开。':'默认仅自己可见。'} 已有评分不会被覆盖。`))return;
    isBusy=true;const button=$('sheet-confirm');if(button)button.disabled=true;
    let inserted=0,skipped=0,created=0;const errors=[];
    try{
      for(const row of selected){
        try{
          let item=matchedImportItem(row);
          if(!item&&row.remoteChoice)item=findExistingCatalogItem(data.items,row.remoteChoice);
          if(!item){const remoteItem=row.remoteChoice;item=await createCatalogItem(remoteItem?{
            category:remoteItem.category,name:remoteItem.name,subtitle:remoteItem.subtitle,description:remoteItem.description,year:remoteItem.year,coverUrl:remoteItem.coverUrl,sourceUrl:remoteItem.sourceUrl,provider:remoteItem.provider,providerItemId:remoteItem.providerId,platform:remoteItem.platform,tags:remoteItem.tags,bangumiScore:remoteItem.bangumiScore,bangumiRatingTotal:remoteItem.bangumiRatingTotal,bangumiRank:remoteItem.bangumiRank
          }:{category:row.category,name:row.name,subtitle:row.subtitle,year:row.year});created++;}
          if(own(item.id)){skipped++;continue}
          const {error}=await db.from('experiences').insert({user_id:ME,item_id:item.id,circle_id:share?activeCircle.id:null,visibility:share?'circle':'private',rating:row.rating,status:row.status,note:row.note,spoiler:false});
          if(error){if(error.code==='23505'){skipped++;continue}throw error}
          data.records.push({itemId:item.id,userId:ME,rating:row.rating,status:row.status,note:row.note,visibility:share?'circle':'private',updatedAt:new Date().toISOString()});inserted++;
        }catch(e){skipped++;errors.push(`${row.name}: ${displayError(e)}`)}
      }
      sheetLookupSerial++;closeModal();bulkDraft=null;await refreshAll(false);toast(`导入完成：新增 ${inserted} 条，跳过/失败 ${skipped} 条，新建作品 ${created} 条`);
      if(errors.length)alert('部分行未导入：\n'+errors.slice(0,12).join('\n'));
    }finally{isBusy=false}
  }

  function gate(kind){

  const unwrap=(result)=>{if(result.error)throw result.error;return result.data};
  function mapCatalog(i){return {id:i.id,category:i.category,name:i.name,subtitle:i.subtitle||'',description:i.description||'',coverUrl:i.cover_url||'',sourceUrl:i.source_url||'',wikiTitle:i.wiki_title||'',emoji:i.emoji||CAT_EMOJI[i.category],year:i.year||'',tags:i.tags||[],provider:i.provider||null,providerItemId:i.provider_item_id||null,platform:i.bangumi_platform||'',bangumiScore:i.bangumi_score==null?null:Number(i.bangumi_score),bangumiRatingTotal:i.bangumi_rating_total??null,bangumiRank:i.bangumi_rank??null,...(detailMetadata.get(i.id)||{})}};
  function mapExperience(r){return {id:r.id,userId:r.user_id,itemId:r.item_id,rating:r.rating==null?null:Number(r.rating),status:r.status,note:r.note||'',spoiler:!!r.spoiler,visibility:r.visibility,updatedAt:r.updated_at}};

  let refreshTimer=null;
  function subscribeToCircle(){
    if(subscription){db.removeChannel(subscription);subscription=null}
    if(!activeCircle)return;
    const onChange=()=>{clearTimeout(refreshTimer);refreshTimer=setTimeout(()=>{if(document.visibilityState==='visible')refreshAll(false)},450)};
    subscription=db.channel('tongpin-live-'+activeCircle.id+'-'+Date.now())
      .on('postgres_changes',{event:'*',schema:'public',table:'experiences'},onChange)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'catalog_items'},onChange)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'circle_members'},onChange)
      .subscribe();
  }

  async function refreshAll(showToast=false){
    const run=++refreshSerial,wasCircle=activeCircle?.id;
    try{
      fetchError='';
      if(!db)throw Error('Supabase 尚未配置');
      if(!authUser){
        ME=null;USERS=[];activeCircle=null;inviteCode='';data={items:[],records:[]};
        if(subscription){db.removeChannel(subscription);subscription=null}
        return;
      }
      ME=authUser.id;
      let myProfile=unwrap(await db.from('profiles').select('id,nickname').eq('id',ME).maybeSingle());
      if(!myProfile){
        myProfile=unwrap(await db.from('profiles').insert({id:ME,nickname:'同频伙伴'}).select('id,nickname').single());
      }
      const membership=unwrap(await db.from('circle_members').select('circle_id').eq('user_id',ME).maybeSingle());
      if(!membership){
        activeCircle=null;inviteCode='';USERS=[{id:ME,name:myProfile.nickname}];data={items:[],records:[]};
        if(subscription){db.removeChannel(subscription);subscription=null}
        return;
      }
      const circleId=membership.circle_id;
      const [circleResult,memberResult,profileResult,itemResult,recordResult]=await Promise.all([
        db.from('circles').select('id,name,owner_id').eq('id',circleId).single(),
        db.from('circle_members').select('user_id').eq('circle_id',circleId),
        db.from('profiles').select('id,nickname'),
        db.from('catalog_items').select('*').order('created_at',{ascending:true}),
        db.from('experiences').select('*').order('updated_at',{ascending:false})
      ]);
      const theCircle=unwrap(circleResult),members=unwrap(memberResult),profiles=unwrap(profileResult),items=unwrap(itemResult),records=unwrap(recordResult);
      let code='';
      if(theCircle.owner_id===ME){const res=await db.rpc('get_invite_code');code=unwrap(res)||''}
      if(run!==refreshSerial)return;
      activeCircle=theCircle;inviteCode=code;
      const pmap=new Map(profiles.map(p=>[p.id,p.nickname]));
      USERS=members.map(m=>({id:m.user_id,name:pmap.get(m.user_id)||'圈子伙伴'})).sort((a,b)=>a.id===ME?-1:b.id===ME?1:a.name.localeCompare(b.name,'zh-CN'));
      data={items:items.map(mapCatalog),records:records.map(mapExperience)};
      if(wasCircle!==activeCircle.id){threadData={posts:[],comments:[],loading:false,error:'',circleId:'',loadedAt:0};subscribeToCircle();}
      // 地点图片不再在大陆用户浏览器中请求境外 Wikipedia；没有合法可用封面时使用占位。
      if(showToast)toast('圈子数据已同步');
    }catch(error){
      if(run===refreshSerial){fetchError=displayError(error);console.error('[同频] 数据同步失败',error)}
    }finally{if(run===refreshSerial){loading=false;render();if(view.page==='detail')void hydrateBangumiDetail(view.detailId);if(['feed','posts','post','detail'].includes(view.page)&&activeCircle)void loadPosts()}}
  }

  async function saveExperience(r){
    if(!authUser||!activeCircle)throw Error('需要先登录并加入圈子');
    const record={user_id:ME,item_id:r.itemId,circle_id:r.visibility==='circle'?activeCircle.id:null,
      visibility:r.visibility,status:r.status,rating:r.rating,note:r.note,spoiler:r.spoiler,updated_at:new Date().toISOString()};
    unwrap(await db.from('experiences').upsert(record,{onConflict:'user_id,item_id'}));
    await refreshAll(false);
  }
  async function deleteExperience(itemId){
    if(!ME)return;
    try{
      unwrap(await db.from('experiences').delete().eq('user_id',ME).eq('item_id',itemId));
      closeModal();await refreshAll(false);toast('记录已从云端删除');
    }catch(error){toast('删除失败：'+displayError(error))}
  }
  async function createCatalogItem(item){
    const {data:inserted,error}=await db.from('catalog_items').insert({
      category:item.category,name:item.name.trim().slice(0,100),subtitle:(item.subtitle||'').slice(0,120),
      description:(item.description||'').slice(0,1500),cover_url:httpsUrl(item.coverUrl)||'',
      source_url:httpsUrl(item.sourceUrl)||'',year:String(item.year||'').slice(0,8),
      provider:item.provider||null,provider_item_id:item.providerItemId||null,
      emoji:item.emoji||CAT_EMOJI[item.category],created_by:ME,circle_id:activeCircle.id,
      tags:Array.isArray(item.tags)?item.tags.filter(t=>typeof t==='string').slice(0,8):[],
      bangumi_platform:item.provider==='bangumi'?String(item.platform||'').slice(0,80):'',
      bangumi_score:item.provider==='bangumi'&&Number(item.bangumiScore)>0?item.bangumiScore:null,
      bangumi_rating_total:item.provider==='bangumi'?(item.bangumiRatingTotal??null):null,
      bangumi_rank:item.provider==='bangumi'?(item.bangumiRank??null):null
    }).select('*').single();
    if(error){
      if(error.code==='23505'){
        await refreshAll(false);
        const existing=findExistingCatalogItem(data.items,{...item,providerId:item.providerItemId});
        if(existing)return existing;
      }
      throw error;
    }
    const created=mapCatalog(inserted);
    // Insert is committed and returned by Supabase. Make it available to the
    // rating form immediately, without waiting for a potentially stale refresh.
    if(!itemById(created.id))data.items.push(created);
    return created;
  }
  function validatedEmail(value){
    const email=String(value||'').trim().toLowerCase();
    if(!/^\S+@\S+\.\S+$/.test(email)||email.length>254)throw Error('请输入有效的邮箱地址');
    return email;
  }
  function validatedPassword(value){
    const password=String(value||'');
    if(password.length<8||password.length>128)throw Error('密码长度应为 8～128 位');
    return password;
  }
  async function finishSignIn(result){
    if(!result?.session?.access_token||!result?.user)throw Error('未获得登录会话。请检查 Supabase 是否关闭了 Confirm Email 设置。');
    authUser=result.user;
    loading=false;
    fetchError='';
    await refreshAll(false);
    render();
  }
  async function logout(){
    if(!db)return;
    try{unwrap(await db.auth.signOut());authUser=null;fetchError='';loading=false;await refreshAll(false);location.hash='feed';toast('已退出登录')}
    catch(error){toast('退出登录失败：'+displayError(error))}
  }
  async function boot(){
    if(!ready){loading=false;render();return}
    try{
      const {data:{session},error}=await db.auth.getSession();if(error)throw error;
      authUser=session?.user||null;
      await refreshAll(false);
      db.auth.onAuthStateChange((event,session)=>{
        if(['SIGNED_IN','SIGNED_OUT','USER_UPDATED'].includes(event)){
          const nextId=session?.user?.id||null;
          if(nextId===authUser?.id&&event!=='USER_UPDATED')return;
          authUser=session?.user||null;
          setTimeout(()=>refreshAll(false),0);
        }
      });
      document.addEventListener('visibilitychange',()=>{
        if(document.visibilityState==='visible'&&authUser&&activeCircle)refreshAll(false);
      });
      // 对从圈内公开改为私密的记录，接收方可能不会收到 UPDATE 事件：
      // 定期重新走 RLS 查询，避免浏览器长期停留在旧的公开状态。
      setInterval(()=>{
        if(document.visibilityState==='visible'&&authUser&&activeCircle)refreshAll(false);
      },60000);
    }catch(error){fetchError=displayError(error);loading=false;render()}
  }

  function render(){
    const active=ready && !loading && authUser && activeCircle;
    document.body.classList.toggle('auth-mode',!active);
    document.body.classList.toggle('travel-detail-mode',active && view.page==='detail' && itemById(view.detailId)?.category==='place');
    if(!ready){$('page').innerHTML=gate('setup');return}
    if(loading){$('page').innerHTML=gate('loading');return}
    if(fetchError){$('page').innerHTML=gate('error');return}
    if(!authUser){$('page').innerHTML=gate('login');return}
    if(!activeCircle){$('page').innerHTML=gate('circle');return}
    $('rail-foot').innerHTML=`<div class="circle-avatar-stack">${USERS.slice(0,4).map(u=>`<span>${esc(u.name.slice(-1))}</span>`).join('')}</div><strong>${esc(activeCircle.name)}</strong><small>${USERS.length} 位成员 · 私密圈子</small><div class="private-hint">🔒 登录与 RLS 权限保护 · 成员评分已云端同步</div>`;
    nav();document.querySelector('.brand small').textContent=theme==='archive'?'THE COLLECTION / PERSONAL INDEX':'VIDEO CLUB / EST. 2026';$('page').dataset.page=view.page;
    $('page').innerHTML=({feed,discover,circle,posts,post:postPage,travel,me,detail:detailPage}[view.page]||feed)();side();initVisualMotion();
  }

  let motionObserver=null;
  function initVisualMotion(){
    motionObserver?.disconnect();
    const sections=document.querySelectorAll('#page .panel,#page .gallery-feature,#page .overview-row,#page .library-room,#page .hero,#page .intro');
    if(!('IntersectionObserver' in window)||matchMedia('(prefers-reduced-motion: reduce)').matches){sections.forEach(el=>el.classList.add('is-revealed'));return}
    motionObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('is-revealed');motionObserver.unobserve(entry.target)}}),{rootMargin:'0px 0px 35px 0px',threshold:.055});
    sections.forEach(el=>{el.classList.add('reveal-on-scroll');motionObserver.observe(el)});
  }
  // Motion: pointer-tracked highlights, not constant expensive page-wide animation.
  if(matchMedia('(hover:hover) and (pointer:fine)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    let pending=false,lastEvent=null;
    document.addEventListener('pointermove',ev=>{
      const el=ev.target.closest('.gallery-hero,.shelf-book,.feature-volume');
      if(!el)return;lastEvent={el,x:ev.clientX,y:ev.clientY};
      if(pending)return;pending=true;
      requestAnimationFrame(()=>{pending=false;if(!lastEvent)return;const {el,x,y}=lastEvent;const rect=el.getBoundingClientRect();const px=(x-rect.left)/rect.width,py=(y-rect.top)/rect.height;
        el.style.setProperty('--pointer-x',`${(px*100).toFixed(1)}%`);el.style.setProperty('--pointer-y',`${(py*100).toFixed(1)}%`);
        if(el.classList.contains('shelf-book')){el.style.setProperty('--tilt-x',`${((.5-py)*9).toFixed(2)}deg`);el.style.setProperty('--tilt-y',`${((px-.5)*12).toFixed(2)}deg`)}
      });
    },{passive:true});
    document.addEventListener('pointerout',ev=>{const el=ev.target.closest('.shelf-book');if(el&&!el.contains(ev.relatedTarget)){el.style.removeProperty('--tilt-x');el.style.removeProperty('--tilt-y')}},{passive:true});
  }
  let scrollRaf=false;
  window.addEventListener('scroll',()=>{
    if(scrollRaf)return;scrollRaf=true;
    requestAnimationFrame(()=>{
      scrollRaf=false;
      const doc=document.documentElement, range=doc.scrollHeight-doc.clientHeight;
      const p=range>0?Math.max(0,Math.min(1,doc.scrollTop/range)):0;
      const bar=$('reading-progress');if(bar)bar.style.transform=`scaleX(${p})`;
      const hero=document.querySelector('.immersive-hero');
      if(hero && !matchMedia('(prefers-reduced-motion: reduce)').matches){
        const r=hero.getBoundingClientRect();
        if(r.bottom>0&&r.top<innerHeight){const depth=Math.max(-1,Math.min(1,-r.top/Math.max(1,r.height)));hero.style.setProperty('--hall-shift',`${(-depth*26).toFixed(1)}px`)}
      }
    });
  },{passive:true});
  function selectionOptions(items,selected) {return items.map(([value,label])=>`<option value="${value}" ${selected===value?'selected':''}>${esc(label)}</option>`).join('')}
  function openModal(html){$('modal-root').innerHTML=`<div class="modal-backdrop" data-action="modal-background"><div class="modal" role="dialog" aria-modal="true" aria-label="编辑体验">${html}</div></div>`}

  function ratingDistribution(id){
    const scores=visibleRatings(id).map(r=>r.rating);
    if(!scores.length)return '<div class="distribution-empty">还没有圈内评分，来成为第一个评价的人吧。</div>';
    const ranges=[[8,10,'8–10'],[6,8,'6–8'],[4,6,'4–6'],[2,4,'2–4'],[0,2,'0–2']];
    const max=Math.max(1,...ranges.map(([lower,upper])=>scores.filter(n=>n>lower&&n<=upper).length));
    return `<div class="dist-caption">圈内评分分布</div><div class="dist-list">${ranges.map(([lower,upper,label])=>{
      const count=scores.filter(n=>n>lower&&n<=upper).length;
      return `<div class="dist-line"><span>${label}</span><div class="dist-track"><i style="width:${count/max*100}%"></i></div><small>${count}</small></div>`
    }).join('')}</div>`;
  }

  document.addEventListener('submit', async e=>{
    const form=e.target, id=form.id;
    if(!['record-form','item-form','password-login-form','register-form','password-form','create-circle-form','join-circle-form','nickname-form','post-form','comment-form'].includes(id))return;
    e.preventDefault();
    if(isBusy)return;
    const f=new FormData(form);
    try{
      isBusy=true;
      if(id==='password-login-form'){
        const email=validatedEmail(f.get('email'));
        const password=String(f.get('password')||'');
        const {data:result,error}=await db.auth.signInWithPassword({email,password});
        if(error)throw error;
        await finishSignIn(result);
        toast('登录成功，欢迎回来！');
      } else if(id==='register-form'){
        const email=validatedEmail(f.get('email'));
        const password=validatedPassword(f.get('password'));
        if(password!==String(f.get('confirmPassword')||''))throw Error('两次输入的密码不一致');
        const {data:result,error}=await db.auth.signUp({email,password});
        if(error)throw error;
        if(!result?.session)throw Error('注册已提交，但未获得登录会话。请在 Supabase → Authentication → Email 中关闭 Confirm Email，再重试登录。');
        await finishSignIn(result);
        toast('注册成功！请选择创建圈子或输入邀请码加入圈子。');
      } else if(id==='password-form'){
        const password=validatedPassword(f.get('newPassword'));
        if(password!==String(f.get('confirmPassword')||''))throw Error('两次输入的密码不一致');
        const {error}=await db.auth.updateUser({password});
        if(error)throw error;
        form.reset();
        toast('密码已设置或更新。后续可以通过邮箱和密码登录。');
      } else if(id==='create-circle-form'){
        const {error}=await db.rpc('create_circle',{p_name:String(f.get('circleName')||'').trim()});
        if(error)throw error;
        await refreshAll(true);toast('圈子创建成功！');
      } else if(id==='join-circle-form'){
        const {error}=await db.rpc('join_circle',{p_code:String(f.get('inviteCode')||'').trim()});
        if(error)throw error;
        await refreshAll(true);toast('成功加入圈子！');
      } else if(id==='nickname-form'){
        const nickname=String(f.get('nickname')||'').trim().slice(0,40);
        if(!nickname)throw Error('请输入昵称');
        const {error}=await db.from('profiles').update({nickname}).eq('id',ME);
        if(error)throw error;
        await refreshAll(true);toast('昵称已更新');
      } else if(id==='post-form'){
        const item=itemById(String(f.get('itemId')||''));if(!item||!['game','anime'].includes(item.category))throw Error('请选择游戏或动画作品');
        const title=String(f.get('title')||'').trim(),body=String(f.get('body')||'').trim();
        if(title.length<2||title.length>80||body.length<1||body.length>5000)throw Error('标题需要 2～80 字，正文需要 1～5000 字');
        unwrap(await db.from('circle_posts').insert({user_id:ME,circle_id:activeCircle.id,item_id:item.id,title,body,spoiler:f.has('spoiler')}));
        closeModal();await loadPosts(true);location.hash='posts';syncRoute();toast('帖子已发布到圈内');
      } else if(id==='comment-form'){
        const post=threadData.posts.find(x=>x.id===String(f.get('postId')));const body=String(f.get('body')||'').trim();
        if(!post||body.length<1||body.length>1000)throw Error('回复需要 1～1000 字');
        unwrap(await db.from('post_comments').insert({user_id:ME,circle_id:activeCircle.id,post_id:post.id,body}));
        await loadPosts(true);toast('回复已发布');
      } else if(id==='record-form'){
        const item=itemById(String(f.get('itemId')));
        if(!item)throw Error('请先创建或选择条目');
        const raw=String(f.get('rating')||'').trim();const rating=raw===''?null:Number(raw);
        if(rating!==null&&(!Number.isFinite(rating)||rating<.5||rating>10||rating*2!==Math.round(rating*2)))throw Error('评分需要在 0.5～10 之间，步长为 0.5');
        const status=String(f.get('status'));
        if(!STATUS[item.category].some(x=>x[0]===status))throw Error('请选择正确的体验状态');
        await saveExperience({itemId:item.id,status,rating,note:String(f.get('note')||'').trim().slice(0,2000),visibility:f.get('visibility')==='private'?'private':'circle',spoiler:f.has('spoiler')});
        closeModal();toast('记录已保存到云端');
      } else if(id==='item-form'){
        const name=String(f.get('name')||'').trim().slice(0,100),category=String(f.get('category')),
              subtitle=String(f.get('subtitle')||'').trim().slice(0,120),rawCover=String(f.get('coverUrl')||'').trim();
        if(!name||!CAT_NAME[category])throw Error('请输入合法的条目名称');
        if(rawCover&&!httpsUrl(rawCover))throw Error('封面必须使用 HTTPS 图片直链');
        const existing=data.items.find(x=>x.category===category&&x.name.toLocaleLowerCase()===name.toLocaleLowerCase());
        if(existing){closeModal();recordForm(existing.id);toast('条目已存在，直接记录体验即可');return}
        const result=await createCatalogItem({category,name,subtitle,coverUrl:httpsUrl(rawCover)});
        closeModal();recordForm(result.id);toast('共享条目创建成功');
      }
    }catch(err){toast('操作失败：'+displayError(err));}
    finally{isBusy=false}
  });

  async function importData(input){
    const file=input.files?.[0];if(!file)return;
    try{
      const payload=JSON.parse(await file.text());
      if(!Array.isArray(payload.items)||!Array.isArray(payload.records)||payload.records.length>200||payload.items.length>200)throw Error('只支持含 items/records 的 JSON 备份，单次最多 200 条');
      if(!confirm('导入的历史记录将以“仅自己可见”保存到云端，现有评分不会被覆盖，继续吗？'))return;
      const alias=new Map();
      for(const item of payload.items){
        if(!item||!CAT_NAME[item.category]||typeof item.name!=='string'||!item.name.trim())throw Error('备份条目无效');
        let existing=data.items.find(x=>x.id===item.id||x.providerItemId===item.id||(x.category===item.category&&x.name.trim().toLowerCase()===item.name.trim().toLowerCase()));
        if(!existing)existing=await createCatalogItem({category:item.category,name:item.name.slice(0,100),subtitle:String(item.subtitle||'').slice(0,120),coverUrl:httpsUrl(item.coverUrl)});
        alias.set(item.id,existing.id);
      }
      let count=0,skipped=0;
      for(const r of payload.records){
        if(!r||typeof r.itemId!=='string'||typeof r.note!=='string'){skipped++;continue}
        const item=data.items.find(x=>x.id===alias.get(r.itemId)||x.providerItemId===r.itemId||x.id===r.itemId);
        if(!item||own(item.id)){skipped++;continue}
        const rating=r.rating==null?null:Number(r.rating);
        if(rating!==null&&(!Number.isFinite(rating)||rating<0.5||rating>10||rating*2!==Math.round(rating*2))){skipped++;continue}
        const status=(STATUS[item.category]||[]).some(x=>x[0]===r.status)?r.status:'want';
        const {error}=await db.from('experiences').insert({user_id:ME,item_id:item.id,circle_id:null,visibility:'private',rating,status,note:r.note.slice(0,2000),spoiler:!!r.spoiler});
        if(error){skipped++;continue}count++;
        await refreshAll(false);
      }
      await refreshAll(true);toast(`已导入 ${count} 条私人记录，跳过 ${skipped} 条`);
    }catch(err){toast('导入失败：'+displayError(err))}
    finally{input.value=''}
  }

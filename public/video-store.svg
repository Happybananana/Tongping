  <text x="180" y="184" font-size="18" font-family="monospace" text-anchor="middle" fill="#17232b" letter-spacing="7">▶ 00:04:08</text>
  <circle cx="380" cy="68" r="13" fill="#e7dc8d"/><circle cx="380" cy="111" r="13" fill="#e7dc8d"/><rect x="366" y="183" width="32" height="9" rx="4" fill="#767873"/><rect x="366" y="209" width="32" height="9" rx="4" fill="#767873"/>
 </g>

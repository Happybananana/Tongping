 <rect x="682" y="194" width="230" height="322" fill="#d6a076"/>
 <circle cx="803" cy="316" r="93" fill="#f3e77b"/>
 <path d="M700 471L802 288L910 472Z" fill="#222a36"/>
 <path d="M702 475H912" stroke="#191b21" stroke-width="22"/>
 <text x="802" y="229" font-size="22" fill="#222329" font-family="monospace" font-weight="900" text-anchor="middle">TONIGHT'S</text>
 <text x="802" y="255" font-size="22" fill="#222329" font-family="monospace" font-weight="900" text-anchor="middle">FEATURE</text>
 <text x="804" y="501" font-size="27" fill="#f9e77d" font-family="monospace" font-weight="900" text-anchor="middle">PLAY IT AGAIN</text>
 <!-- right side big CRT -->
 <g transform="translate(1110 239)">
  <rect x="-12" y="-15" width="438" height="322" rx="30" fill="#1a1b20" stroke="#07070b" stroke-width="12"/>
  <rect x="17" y="12" width="329" height="247" rx="19" fill="#171b22" stroke="#858173" stroke-width="10"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
 <defs>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#343943"/><stop offset=".55" stop-color="#57515c"/><stop offset="1" stop-color="#23252d"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#514752"/><stop offset=".6" stop-color="#2b2b34"/><stop offset="1" stop-color="#14161c"/></linearGradient>
  <linearGradient id="light" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbed91" stop-opacity=".34"/><stop offset="1" stop-color="#fbed91" stop-opacity="0"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#fff3b8" stop-opacity=".8"/><stop offset=".2" stop-color="#fbdc6b" stop-opacity=".34"/><stop offset="1" stop-color="#fbdc6b" stop-opacity="0"/></radialGradient>
  <pattern id="paper" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".6" fill="#ffffff" opacity=".05"/></pattern>
  <pattern id="cases" width="65" height="92" patternUnits="userSpaceOnUse">
    <rect x="0" y="0" width="64" height="91" fill="#19191e" stroke="#4b4648" stroke-width="2"/>
    <rect x="7" y="10" width="49" height="67" rx="1" fill="#a69a6f"/>
    <path d="M8 20L55 68M55 19L8 69" stroke="#ccbc8b" stroke-width="6" opacity=".6"/>
    <rect x="6" y="76" width="52" height="9" fill="#151519"/><path d="M15 81h32" stroke="#fae25e" stroke-width="2"/>
  </pattern>
  <pattern id="tile" width="180" height="100" patternUnits="userSpaceOnUse" patternTransform="skewX(-25)"><path d="M0 0H180V100H0Z" fill="none" stroke="#828181" stroke-width="1.8" opacity=".22"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="20"/></filter>
 </defs>
 <rect width="1600" height="900" fill="url(#wall)"/>

 <path d="M0 735L1600 568V900H0Z" fill="url(#floor)"/>
 <path d="M0 735L1600 568V900H0Z" fill="url(#tile)"/>
 <!-- diagonal ceiling strips -->
 <path d="M0 124L1600 28" stroke="#1b1d22" stroke-width="64"/>
 <path d="M0 120L1600 24" stroke="#c1ae69" stroke-width="7" opacity=".6"/>
 <path d="M0 222L1600 140" stroke="#1d1f26" stroke-width="22" opacity=".6"/>

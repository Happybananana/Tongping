 <path d="M980 720L1537 634M980 764L1537 680" stroke="#f5d67b" stroke-width="5" opacity=".21"/>
 <!-- reflection and practical lights -->
 <ellipse cx="1250" cy="240" rx="280" ry="240" fill="url(#halo)" opacity=".3"/>
 <path d="M1020 100L1600 37V610L1020 730Z" fill="url(#light)" opacity=".55"/>
 <rect width="1600" height="900" fill="url(#paper)"/>
</svg>

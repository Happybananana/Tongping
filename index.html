<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f4eacb" />
  <meta name="description" content="同频：好友私人游戏、动画与旅行地点评分空间。" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>同频 · VIDEO CLUB / RAILWAY</title>
</head>
<body>
  <div class="ambient ambient-a" aria-hidden="true"></div><div class="ambient ambient-b" aria-hidden="true"></div><div class="page-grain" aria-hidden="true"></div><div class="reading-progress" id="reading-progress" aria-hidden="true"></div>
  <div class="shell">
    <header class="site-header">
      <button class="brand" data-action="navigate" data-page="feed" aria-label="同频首页">
        <span class="brand-logo"><span>▶</span></span><span><strong>同频</strong><small>VIDEO CLUB / EST. 2026</small></span>
      </button>
      <nav class="top-nav" id="top-nav" aria-label="桌面主导航"></nav>
      <div class="header-actions"><span class="header-now"><b></b> NOW PLAYING</span>
        <button class="header-record" data-action="new-record" aria-label="记录新的体验">＋ 录入新体验</button>
        <span class="environment-chip"><span class="live-dot"></span>PLAYING NOW · 0.5.0</span>
        <button class="icon-button" data-action="refresh" title="刷新圈子数据" aria-label="刷新圈子数据">⟳</button>
        <button class="icon-button" data-action="export" title="导出我的数据" aria-label="导出我的数据">↓</button>
        <button class="avatar mini" data-action="navigate" data-page="me" title="我的主页">我</button>
      </div>
    </header>
    <div class="layout">
      <aside class="rail">
        <div class="rail-subtitle">VIDEO INDEX / 录像片单</div>
        <nav class="rail-nav" id="side-nav" aria-label="主导航"></nav>
        <button class="add-main" data-action="new-record"><span>＋</span> 录入一条新体验</button>
        <div class="rail-foot" id="rail-foot"></div>
      </aside>
      <main id="page" class="content" tabindex="-1" aria-live="polite"></main>
      <aside class="right-rail" id="right-rail"></aside>
    </div>
    <nav class="bottom-nav" id="bottom-nav" aria-label="手机主导航"></nav>
  </div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json" hidden />
  <script type="module" src="/src/main.js"></script>
</body>
</html>
